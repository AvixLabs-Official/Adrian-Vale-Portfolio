<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Case Study — Adrian Vale</title>
  <meta name="description" content="Detailed case study, brand strategy, and interaction design by Adrian Vale.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="header scrolled" id="main-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-name">ADRIAN VALE</a>
      <a href="index.html#work" class="btn-link" style="color:var(--color-accent); font-weight:700; display:inline-flex; align-items:center; gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Selected Work</span>
      </a>
    </div>
  </header>

  <main style="padding-top: calc(var(--header-height) + 40px); padding-bottom: 120px;">
    <div class="container" id="standalone-project-container">
      <!-- Rendered dynamically via JS based on ?id=proj-01 -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 ADRIAN VALE. All rights reserved.</div>
        <div style="font-style:italic;">Adrian Vale is a fictional portfolio demonstration project.</div>
      </div>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projId = urlParams.get('id') || 'proj-01';
      const container = document.getElementById('standalone-project-container');
      const proj = PROJECTS_DATA.find(p => p.id === projId) || PROJECTS_DATA[0];

      if (container && proj) {
        document.title = `${proj.name} — Adrian Vale Case Study`;
        container.innerHTML = `
          <div style="background:var(--bg-card); border:1px solid var(--border-color); padding:60px; border-radius:var(--radius-sm);">
            <span style="font-family:var(--font-display); font-size:0.9rem; text-transform:uppercase; color:var(--color-accent); font-weight:700;">${proj.category} • ${proj.year}</span>
            <h1 style="font-size:clamp(3rem, 6vw, 5rem); margin:12px 0 20px;">${proj.name}</h1>
            <p style="font-size:1.3rem; color:var(--text-muted); max-width:720px; margin-bottom:40px;">${proj.subtitle}</p>

            <div style="aspect-ratio:16/9; overflow:hidden; border-radius:var(--radius-sm); margin-bottom:60px;">
              <img src="${proj.image}" alt="${proj.name}" style="width:100%; height:100%; object-fit:cover;">
            </div>

            <div style="display:grid; grid-template-columns:1.2fr 0.8fr; gap:60px; align-items:start;">
              <div>
                <h3 style="font-size:1.8rem; margin-bottom:16px;">Strategy & Execution</h3>
                <p style="font-size:1.1rem; color:var(--text-muted); line-height:1.8; margin-bottom:24px;">${proj.description}</p>
                <div style="padding:20px; background:var(--bg-primary); border-left:4px solid var(--color-accent); font-size:1.1rem; font-weight:700;">Key Impact: ${proj.impact}</div>
              </div>

              <div style="background:var(--bg-primary); border:1px solid var(--border-color); padding:32px; border-radius:var(--radius-sm);">
                <div style="margin-bottom:20px;">
                  <span style="font-size:0.8rem; text-transform:uppercase; color:var(--color-accent); font-weight:700; display:block;">Client</span>
                  <span style="font-size:1.1rem; font-weight:700;">${proj.client}</span>
                </div>
                <div>
                  <span style="font-size:0.8rem; text-transform:uppercase; color:var(--color-accent); font-weight:700; display:block; margin-bottom:8px;">Services Delivered</span>
                  <ul style="list-style:none; display:flex; flex-direction:column; gap:8px;">
                    ${proj.services.map(s => `<li style="font-size:0.95rem; color:var(--text-muted);">• ${s}</li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
